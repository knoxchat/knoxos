name: Nightly images

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_UEFI_RUSTFLAGS: "-C llvm-args=-disable-loop-idiom-wcslen"

jobs:
  nightly:
    name: Build + checksum images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + rust-src
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Build kernel + BIOS image
        run: |
          ./scripts/kernel-cargo.sh build --release
          cargo run -p knoxos-boot --release -- kernel/target/x86_64-unknown-none/release/knoxos-kernel
      - name: Checksums + ISO
        run: ./scripts/release-checksums.sh
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: knoxos-nightly
          path: dist/
          if-no-files-found: error
