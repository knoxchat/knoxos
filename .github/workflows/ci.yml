name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # LLVM 23 may emit `wcslen` for UEFI; the UEFI target has no libc.
  CARGO_TARGET_X86_64_UNKNOWN_UEFI_RUSTFLAGS: "-C llvm-args=-disable-loop-idiom-wcslen"

jobs:
  docs:
    name: Docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require README, LICENSE, status.md
        run: |
          test -f README.md
          test -f LICENSE
          test -f status.md

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + rustfmt
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Format check
        working-directory: kernel
        run: cargo fmt -- --check

  clippy-size:
    name: clippy + size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + clippy
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Clippy
        working-directory: kernel
        # Compile + lint. Do not fail the tree on every Clippy warning yet.
        run: cargo clippy --release
      - name: Release size gate
        working-directory: kernel
        run: make ci-size

  qemu-boot:
    name: QEMU BIOS boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Install nightly
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Build kernel + BIOS image
        working-directory: kernel
        run: |
          cargo build --release
          cd ../boot && cargo run --release -- ../kernel/target/x86_64-unknown-none/release/knoxos-kernel
      - name: Boot until desktop marker
        run: |
          BIOS_IMG=kernel/target/x86_64-unknown-none/release/knoxos-bios.img
          test -f "$BIOS_IMG"
          qemu-system-x86_64 \
            -drive format=raw,file="$BIOS_IMG" \
            -serial file:serial.log \
            -display none \
            -m 2G \
            -smp 2 \
            -cpu qemu64,+ssse3,+sse4.1,+sse4.2,+popcnt \
            -no-reboot \
            -no-shutdown &
          QEMU_PID=$!
          for i in $(seq 1 60); do
            sleep 2
            if grep -q "Desktop Environment ready" serial.log 2>/dev/null; then
              echo "boot ok"
              kill "$QEMU_PID" 2>/dev/null || true
              grep -E "RIP switch self-test|Idle thread|GDT:|syscall/sysret" serial.log || true
              exit 0
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU exited early"
              tail -50 serial.log || true
              exit 1
            fi
          done
          echo "timeout waiting for desktop"
          tail -80 serial.log || true
          kill "$QEMU_PID" 2>/dev/null || true
          exit 1
