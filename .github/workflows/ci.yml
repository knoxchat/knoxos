name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # LLVM 23 may emit `wcslen` for UEFI; the UEFI target has no libc.
  CARGO_TARGET_X86_64_UNKNOWN_UEFI_RUSTFLAGS: "-C llvm-args=-disable-loop-idiom-wcslen"

jobs:
  docs:
    name: Docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require README, LICENSE, status tree
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f status.md
          test -f status/README.md
          test -f status/next.md
          test -f docs/architecture.md
          test -f docs/syscalls.md
          test -f docs/drivers.md
          test -f docs/gui.md
      - name: License / SPDX
        run: ./scripts/license-check.sh

  host-tests:
    name: Host parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        run: |
          cargo test -p knoxos-host-tests
          cargo test -p knox-gpui
          ./scripts/check-chromium-ldd.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + rustfmt
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Format check
        run: ./scripts/kernel-cargo.sh fmt -- --check

  clippy-size:
    name: clippy + size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + clippy
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Clippy
        run: ./scripts/kernel-cargo.sh clippy --release
      - name: Release size gate
        working-directory: kernel
        run: make ci-size

  qemu-boot:
    name: QEMU BIOS boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Install nightly
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Build kernel + BIOS image
        run: |
          chmod +x scripts/kernel-cargo.sh
          ./scripts/kernel-cargo.sh build --release
          cargo run -p knoxos-boot --release -- kernel/target/x86_64-unknown-none/release/knoxos-kernel
      - name: Boot until desktop marker
        run: |
          BIOS_IMG=kernel/target/x86_64-unknown-none/release/knoxos-bios.img
          test -f "$BIOS_IMG"
          dd if=/dev/zero of=tests/c1-persist.img bs=1M count=64 status=none
          dd if=/dev/zero of=tests/c9-ext4.img bs=1M count=64 status=none
          python3 scripts/mkfs-ext4-min.py tests/c9-ext4.img
          qemu-system-x86_64 \
            -drive format=raw,file="$BIOS_IMG" \
            -drive if=virtio,format=raw,file=tests/c1-persist.img \
            -drive if=virtio,format=raw,file=tests/c9-ext4.img \
            -device virtio-gpu-pci \
            -device virtio-tablet-pci \
            -device virtio-keyboard-pci \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -device usb-tablet,bus=xhci.0 \
            -serial file:serial.log \
            -display none \
            -m 2G \
            -smp 2 \
            -cpu qemu64,+ssse3,+sse4.1,+sse4.2,+popcnt \
            -no-reboot \
            -no-shutdown &
          QEMU_PID=$!
          for i in $(seq 1 60); do
            sleep 2
            if grep -q "Desktop Environment ready" serial.log 2>/dev/null; then
              echo "boot ok"
              kill "$QEMU_PID" 2>/dev/null || true
              grep -E "RIP switch self-test|Idle thread|GDT:|syscall/sysret|hello from userspace|Returned from Ring 3|GATE_G5|GATE_C9|GATE_USB no ps2" serial.log || true
              fail=0
              for m in "hello from userspace" "GATE_G5 safety comments" "GATE_C9 ext4 root" "GATE_USB no ps2 cursor"; do
                if ! grep -q "$m" serial.log; then
                  echo "FAIL: missing $m"
                  fail=1
                fi
              done
              if [ "$fail" -ne 0 ]; then
                tail -80 serial.log || true
                exit 1
              fi
              exit 0
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU exited early"
              tail -50 serial.log || true
              exit 1
            fi
          done
          echo "timeout waiting for desktop"
          tail -80 serial.log || true
          kill "$QEMU_PID" 2>/dev/null || true
          exit 1

  cross:
    name: Cross-compile aarch64/riscv64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + cross targets
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,llvm-tools-preview \
            --target aarch64-unknown-none,riscv64gc-unknown-none-elf \
            --allow-downgrade
      - name: aarch64 check
        run: KERNEL_TARGET=aarch64-unknown-none ./scripts/kernel-cargo.sh check --release
      - name: riscv64 check
        run: KERNEL_TARGET=riscv64gc-unknown-none-elf ./scripts/kernel-cargo.sh check --release

  cross-boot:
    name: aarch64/riscv64 QEMU boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc
      - name: Install nightly
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,llvm-tools-preview \
            --allow-downgrade
      - name: Build aarch64 + riscv64 kernels
        run: |
          KERNEL_TARGET=kernel/aarch64-knoxos.json ./scripts/kernel-cargo.sh build --release -Zjson-target-spec
          KERNEL_TARGET=kernel/riscv64-knoxos.json ./scripts/kernel-cargo.sh build --release -Zjson-target-spec
      - name: QEMU serial boot
        run: |
          chmod +x scripts/qemu-cross-boot.sh
          ./scripts/qemu-cross-boot.sh

  secure-boot:
    name: OVMF Secure Boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + OVMF + sb tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
            qemu-system-x86 ovmf python3-virt-firmware sbsigntool mtools
      - name: Install nightly
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src,llvm-tools-preview \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: Build kernel + UEFI image
        run: |
          ./scripts/kernel-cargo.sh build --release
          cargo run -p knoxos-boot --release -- kernel/target/x86_64-unknown-none/release/knoxos-kernel
      - name: Enroll PK and boot
        run: |
          chmod +x scripts/secure-boot-enroll.sh scripts/qemu-secure-boot.sh
          ./scripts/qemu-secure-boot.sh

  rustdoc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        working-directory: kernel
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rust-src \
            --target x86_64-unknown-none \
            --allow-downgrade
      - name: rustdoc
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
        run: ./scripts/kernel-cargo.sh doc --release --no-deps --document-private-items
      - name: Upload rustdoc
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: kernel/target/x86_64-unknown-none/doc
          if-no-files-found: error

  audit:
    name: cargo-audit + license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License / SPDX
        run: ./scripts/license-check.sh
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit workspace lockfile
        run: cargo audit
        continue-on-error: true
