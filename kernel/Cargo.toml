[package]
name = "knoxos-kernel"
version = "0.2.1"
edition = "2024"
rust-version = "1.98.1"
description = "KnoxOS - A Rust-based AI Operating System with Desktop GUI"
authors = ["KnoxOS Contributors"]
license = "MIT"

[dependencies]
spin = "0.12.3"
linked_list_allocator = "0.10.6"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
bitflags = "2.13.1"
conquer-once = { version = "0.4.0", default-features = false }
libm = "0.2.16"

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
uart_16550 = "0.8.0"
pic8259 = "0.11.0"
pc-keyboard = "0.9.0"
raw-cpuid = "11.6.0"

[dependencies.crossbeam-queue]
version = "0.3.14"
default-features = false
features = ["alloc"]

[lints.rust]
deprecated = "allow"
unreachable_code = "allow"
suspicious_runtime_symbol_definitions = "allow"

[lints.clippy]
byte_char_slices = "allow"
chunks_exact_to_as_chunks = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
doc_lazy_continuation = "allow"
drain_collect = "allow"
empty_line_after_doc_comments = "allow"
excessive_precision = "allow"
for_kv_map = "allow"
let_and_return = "allow"
manual_range_patterns = "allow"
manual_slice_fill = "allow"
missing_safety_doc = "allow"
needless_return = "allow"
question_mark = "allow"
redundant_closure = "allow"
single_match = "allow"
unnecessary_map_or = "allow"
vec_box = "allow"

[[bin]]
name = "knoxos-kernel"
path = "src/main.rs"
test = false
bench = false

[lib]
doctest = false

[profile.release]
lto = true
opt-level = "z"
